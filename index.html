<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jason Ellsworth Galvin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <span class="logo">J.E.G.</span>

      <div class="toggle-group">
        <span class="toggle-label">Dox</span>
        <button id="theme-toggle" aria-label="Toggle light and dark mode" title="Toggle theme">
          <!-- Moon icon (shown in dark mode) -->
          <svg id="icon-moon" class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                  fill="currentColor"/>
          </svg>

          <!-- Sun icon (shown in light mode) -->
          <svg id="icon-sun" class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="5" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </g>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 class="fade-in">Welcome to the Jason Ellsworth Galvin website!</h1>

      <div class="photo-frame fade-in">
        <!--
          Replace the file below with your own image.
          Put your image file in the same folder as this HTML file
          (for example: profile.jpg) and update the src path to match.
        -->
        <img id="profile-photo" src="profile.jpg" alt="Jason Ellsworth Galvin"
             onerror="this.onerror=null; this.replaceWith(Object.assign(document.createElement('div'), {className:'photo-placeholder', textContent:'Add your image as profile.jpg'}));">
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Jason Ellsworth Galvin</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
